[package]
name = "omavote-wasm"
description = "Browser bindings for the Omavote protocol core (JSON in, JSON out)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
omavote-core = { path = "../omavote-core" }
getrandom = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
