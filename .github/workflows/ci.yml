name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: rustup update stable && rustup default stable
      - run: rustup component add rustfmt clippy && rustup target add wasm32-unknown-unknown
      - run: cargo install --locked wasm-pack cargo-audit
      - run: scripts/ci.sh
  devnet:
    # Real transactions on a local CKB dev chain: deposits, relay, votes, reorg and
    # independent replay.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: rustup update stable && rustup default stable && rustup target add wasm32-unknown-unknown
      - run: cargo install --locked wasm-pack
      - run: (cd web && npm ci && npm run wasm && npm run build)
      - run: (cd verifier-ts && npm ci && npm run build)
      - run: deploy/devnet/setup.sh
      - run: deploy/devnet/run-demo.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devnet-evidence
          path: |
            devnet/demo-out/
            devnet/*.log
