:root[data-theme=&quot;light&quot;] {

:root[data-theme=&quot;dark&quot;] {

}

* {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

  color: var(--foreground);

  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

.cursor-interaction {
  cursor: var(--cursor-interaction, pointer);
}

a {

  cursor: var(--cursor-interaction, pointer);
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

}

h1 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {

  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background: var(--muted);
  font-family: var(--font-mono);

}

.table-responsive {

  overflow-x: auto;
  scrollbar-width: thin;
}

.table {

  color: var(--foreground);

  text-align: start;
}

.table :is(th, td) {

  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget &gt; :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;

.viz-grid {

  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));

}

.viz-stat {

  flex-direction: column;
  gap: 2px;

.viz-stat-value {

  font-weight: var(--font-weight-medium);

}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {

  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {

  border: 0;
  border-radius: var(--radius-full);

.progress-bar:only-child {

.progress-bar {

  border: 0;

}

.viz-badge {

}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {

  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;

  border: 1px solid var(--input);

  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);

  background: transparent;

        target == null ||

      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);

  &lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;omavote-journey-v1&#x27;);

    const scenarios = {
      normal: [
        { title: &#x27;你从论坛打开正式投票链接&#x27;, place: &#x27;浏览器 · 提案页&#x27;, fields: [[&#x27;示例提案&#x27;, &#x27;社区开发工具资助&#x27;], [&#x27;申请预算&#x27;, &#x27;1,000,000 CKB&#x27;], [&#x27;投票窗口&#x27;, &#x27;7 天 · 当前开放&#x27;], [&#x27;连接钱包&#x27;, &#x27;尚未连接；仍可阅读提案和结果&#x27;]], next: &#x27;连接钱包（演示）&#x27;, detail: &#x27;网页是主要入口，不需要新装投票 App。&#x27; },
        { title: &#x27;网页找到这个地址的 DAO 存款&#x27;, place: &#x27;浏览器 · 我的票权&#x27;, fields: [[&#x27;当前地址&#x27;, &#x27;你的存款地址 A&#x27;], [&#x27;预计票权&#x27;, &#x27;100,000 CKB&#x27;], [&#x27;资产操作&#x27;, &#x27;仅查询，存款不移动&#x27;]], choose: true, next: &#x27;查看投票确认页&#x27;, detail: &#x27;示例按截止时有效存款结算；正式规则需先确认。&#x27; },
        { title: &#x27;签名前，核对你的选择&#x27;, place: &#x27;浏览器 · 确认页&#x27;, fields: [[&#x27;提案&#x27;, &#x27;社区开发工具资助&#x27;], [&#x27;我的选择&#x27;, &#x27;$choice&#x27;], [&#x27;我支付的手续费&#x27;, &#x27;0 CKB · 默认由发布服务代付&#x27;], [&#x27;公开内容&#x27;, &#x27;投票地址、选择与计入权重&#x27;]], next: &#x27;打开钱包签名请求（演示）&#x27;, detail: &#x27;这里签署本次选票，没有建立长期代投授权。&#x27; },
        { title: &#x27;你在原来的钱包里确认签名&#x27;, place: &#x27;原钱包 · 签名请求&#x27;, fields: [[&#x27;请求类型&#x27;, &#x27;消息签名&#x27;], [&#x27;用途&#x27;, &#x27;仅本提案的选票&#x27;], [&#x27;选择&#x27;, &#x27;$choice&#x27;], [&#x27;资金转移&#x27;, &#x27;无&#x27;]], next: &#x27;确认签名并提交（演示）&#x27;, detail: &#x27;实际钱包展示样式各异；此处只演示操作类型。&#x27; },
        { title: &#x27;服务已接收，正在发布&#x27;, place: &#x27;浏览器 · 我的回执&#x27;, fields: [[&#x27;我的选择&#x27;, &#x27;$choice&#x27;], [&#x27;状态&#x27;, &#x27;已接收 · 尚未收录&#x27;], [&#x27;原始选票&#x27;, &#x27;已保存，可以重发&#x27;], [&#x27;下一步&#x27;, &#x27;由发布服务支付费用并提交到链上&#x27;]], next: &#x27;查看已收录状态（演示）&#x27;, detail: &#x27;已接收不等于投票完成；关闭网页后服务仍可继续发布。&#x27; },
        { title: &#x27;你的选票已有公共记录&#x27;, place: &#x27;浏览器 · 我的回执&#x27;, fields: [[&#x27;当前选择&#x27;, &#x27;$choice&#x27;], [&#x27;状态&#x27;, &#x27;已收录，并达到确认要求&#x27;], [&#x27;预计权重&#x27;, &#x27;100,000 CKB&#x27;], [&#x27;仍可操作&#x27;, &#x27;改票、撤回、查看公开记录&#x27;]], next: &#x27;投票截止后（演示）&#x27;, detail: &#x27;此时权重仍是预览，截止状态决定最终计入值。&#x27; },
        { title: &#x27;投票关闭，等待结果复核&#x27;, place: &#x27;浏览器 · 结果页&#x27;, fields: [[&#x27;本地址最终选择&#x27;, &#x27;$choice&#x27;], [&#x27;本地址最终权重&#x27;, &#x27;100,000 CKB · 示例存款未变化&#x27;], [&#x27;新票和改票&#x27;, &#x27;窗口已关闭&#x27;], [&#x27;结果状态&#x27;, &#x27;等待链确认与独立复算&#x27;]], next: &#x27;查看复核后结果（演示）&#x27;, detail: &#x27;复核期不接受补投，也不允许管理员手选某张票。&#x27; },
        { title: &#x27;提案通过后，金库人工多签打款&#x27;, place: &#x27;浏览器 · 结果与执行&#x27;, fields: [[&#x27;社区赞成 / 反对&#x27;, &#x27;$totals&#x27;], [&#x27;参与权重&#x27;, &#x27;5,000,000 CKB · 超过 3,000,000 门槛&#x27;], [&#x27;结论&#x27;, &#x27;示例：提案通过，已完成复核&#x27;], [&#x27;执行方式&#x27;, &#x27;三位金库管理者按既有多签规则手动付款&#x27;]], detail: &#x27;投票服务本身没有金库付款权限。&#x27; }
      ],
      neuron: [
        { title: &#x27;在网页选择 Neuron 签名入口&#x27;, place: &#x27;浏览器&#x27;, fields: [[&#x27;使用地址&#x27;, &#x27;持有 DAO 存款的地址 A&#x27;], [&#x27;预计票权&#x27;, &#x27;100,000 CKB&#x27;], [&#x27;所需应用&#x27;, &#x27;这个网页 + 你原有的 Neuron&#x27;]], next: &#x27;选择赞成并复制选票原文（演示）&#x27;, detail: &#x27;不用把助记词或私钥输入网页。&#x27; },
        { title: &#x27;切换到 Neuron 的消息签名功能&#x27;, place: &#x27;Neuron&#x27;, fields: [[&#x27;签名地址&#x27;, &#x27;存款地址 A&#x27;], [&#x27;粘贴内容&#x27;, &#x27;网页生成的完整选票原文&#x27;], [&#x27;待确认选项&#x27;, &#x27;赞成&#x27;]], next: &#x27;在 Neuron 确认签名（演示）&#x27;, detail: &#x27;必须使用对应存款地址，不能随便选钱包里的另一个地址。&#x27; },
        { title: &#x27;复制签名，回到网页粘贴&#x27;, place: &#x27;Neuron → 浏览器&#x27;, fields: [[&#x27;返回网页的内容&#x27;, &#x27;签名结果&#x27;], [&#x27;网页检查&#x27;, &#x27;签名、选票与存款地址是否对应&#x27;], [&#x27;本金&#x27;, &#x27;仍在原来的 Nervos DAO 存款中&#x27;]], next: &#x27;提交已验证选票（演示）&#x27;, detail: &#x27;粘贴错了会提示重新检查，不会产生资产转账。&#x27; },
        { title: &#x27;后续流程与浏览器钱包相同&#x27;, place: &#x27;浏览器 · 我的回执&#x27;, fields: [[&#x27;状态&#x27;, &#x27;已接收，等待公开收录&#x27;], [&#x27;默认费用&#x27;, &#x27;由发布服务代付&#x27;], [&#x27;可以做&#x27;, &#x27;保存回执，稍后查看收录状态&#x27;]], detail: &#x27;同一地址的多笔存款可一起计权；多个不同地址要分别授权。&#x27; }
      ],
      revote: [
        { title: &#x27;你已经投了赞成，现在想改为反对&#x27;, place: &#x27;浏览器 · 我的回执&#x27;, fields: [[&#x27;当前已收录&#x27;, &#x27;赞成&#x27;], [&#x27;预计权重&#x27;, &#x27;100,000 CKB&#x27;], [&#x27;投票窗口&#x27;, &#x27;仍开放&#x27;]], next: &#x27;准备反对选票&#x27;, detail: &#x27;改变的是当前选择，不是再增加一份票权。&#x27; },
        { title: &#x27;确认并签署新的反对选票&#x27;, place: &#x27;原钱包&#x27;, fields: [[&#x27;原来选择&#x27;, &#x27;赞成&#x27;], [&#x27;新选择&#x27;, &#x27;反对&#x27;], [&#x27;费用&#x27;, &#x27;默认由发布服务代付&#x27;]], next: &#x27;签名并提交（演示）&#x27;, detail: &#x27;修订顺序由程序处理，正常用户不用填写序号。&#x27; },
        { title: &#x27;新票还在途中，页面同时显示两种状态&#x27;, place: &#x27;浏览器 · 我的回执&#x27;, fields: [[&#x27;当前已生效&#x27;, &#x27;赞成&#x27;], [&#x27;正在提交&#x27;, &#x27;反对&#x27;], [&#x27;状态&#x27;, &#x27;等待新票收录&#x27;]], next: &#x27;新票收录（演示）&#x27;, detail: &#x27;在新票有效收录前，不把界面提前显示成已改票成功。&#x27; },
        { title: &#x27;反对成为当前选择&#x27;, place: &#x27;浏览器 · 我的回执&#x27;, fields: [[&#x27;当前已收录&#x27;, &#x27;反对&#x27;], [&#x27;计入方式&#x27;, &#x27;这份本金只计一次&#x27;], [&#x27;原赞成票&#x27;, &#x27;保留历史记录，已被新票替代&#x27;]], detail: &#x27;中继之后再发布旧票，也不能把你改回赞成。&#x27; }
      ],
      conflict: [
        { title: &#x27;电脑与手机签出了冲突的修改&#x27;, place: &#x27;两个设备&#x27;, fields: [[&#x27;电脑&#x27;, &#x27;赞成 · 同一修订序号&#x27;], [&#x27;手机&#x27;, &#x27;反对 · 同一修订序号&#x27;], [&#x27;主体&#x27;, &#x27;同一个存款地址&#x27;]], next: &#x27;查看冲突提示&#x27;, detail: &#x27;不同用户投相反意见是正常投票，不属于这种冲突。&#x27; },
        { title: &#x27;无法确定你的最终选择，需要重新确认&#x27;, place: &#x27;浏览器 · 我的回执&#x27;, fields: [[&#x27;状态&#x27;, &#x27;选票冲突&#x27;], [&#x27;当前计入权重&#x27;, &#x27;0 · 该主体暂不计票&#x27;], [&#x27;本金状态&#x27;, &#x27;不受影响&#x27;]], choose: true, next: &#x27;重新签署所选选票（演示）&#x27;, detail: &#x27;后台不能替你从两张已签选票中挑一张。&#x27; },
        { title: &#x27;网页生成一份新的、明确的选择&#x27;, place: &#x27;原钱包&#x27;, fields: [[&#x27;重新确认&#x27;, &#x27;$choice&#x27;], [&#x27;修订顺序&#x27;, &#x27;高于两张冲突票&#x27;], [&#x27;窗口要求&#x27;, &#x27;仍须在截止前有效收录&#x27;]], next: &#x27;新票收录（演示）&#x27;, detail: &#x27;这次重新签名用于明确意图，不需要挪动本金。&#x27; },
        { title: &#x27;冲突解除，继续正常计票&#x27;, place: &#x27;浏览器 · 我的回执&#x27;, fields: [[&#x27;当前选择&#x27;, &#x27;$choice&#x27;], [&#x27;预计权重&#x27;, &#x27;100,000 CKB&#x27;], [&#x27;冲突记录&#x27;, &#x27;保留在历史中&#x27;]], detail: &#x27;若直到截止仍未解决，则该主体不计入最终票数。&#x27; }
      ],
      relay: [
        { title: &#x27;选票已签，但发布服务迟迟没有收录结果&#x27;, place: &#x27;浏览器 · 我的回执&#x27;, fields: [[&#x27;签名&#x27;, &#x27;已完成&#x27;], [&#x27;链上收录&#x27;, &#x27;尚未完成&#x27;], [&#x27;原始选票&#x27;, &#x27;可以导出&#x27;]], next: &#x27;切换另一家发布服务（演示）&#x27;, detail: &#x27;网页不能在这时显示投票完成。&#x27; },
        { title: &#x27;把同一份选票交给另一家服务&#x27;, place: &#x27;浏览器 · 备用发布入口&#x27;, fields: [[&#x27;是否重新签名&#x27;, &#x27;不需要&#x27;], [&#x27;是否移动存款&#x27;, &#x27;不需要&#x27;], [&#x27;提交内容&#x27;, &#x27;原来那份已签选票&#x27;]], next: &#x27;重发原选票（演示）&#x27;, detail: &#x27;如果两家最终都发布，也不会重复计算票权。&#x27; },
        { title: &#x27;备用服务完成发布&#x27;, place: &#x27;浏览器 · 我的回执&#x27;, fields: [[&#x27;状态&#x27;, &#x27;已收录&#x27;], [&#x27;票权&#x27;, &#x27;仍只计一份&#x27;], [&#x27;后续&#x27;, &#x27;等待确认，按原截止时间结算&#x27;]], detail: &#x27;全部服务都不可用时，还需帮助者代发或支持的自费通道；不能保证毫无影响。&#x27; }
      ]
    };
    let state = { scenario: &#x27;normal&#x27;, step: 0, choice: &#x27;YES&#x27; };
    const apply = (saved) =&gt; {
      const s = saved &amp;&amp; saved.privateContent;
      if (!s || !Object.prototype.hasOwnProperty.call(scenarios, s.scenario)) return;
      state.scenario = s.scenario;
      state.step = Number.isInteger(s.step) ? Math.max(0, Math.min(s.step, scenarios[s.scenario].length - 1)) : 0;
      state.choice = s.choice === &#x27;NO&#x27; ? &#x27;NO&#x27; : &#x27;YES&#x27;;
    };
    const save = () =&gt; {
      const host = window.openai;
      if (host &amp;&amp; typeof host.setWidgetState === &#x27;function&#x27;) {
        Promise.resolve(host.setWidgetState({ modelContent: { scenario: state.scenario, step: state.step + 1, choice: state.choice }, privateContent: { ...state } })).catch(() =&gt; {});
      }
    };
    const resolveValue = (v) =&gt; {
      if (v === &#x27;$choice&#x27;) return state.choice === &#x27;YES&#x27; ? &#x27;赞成&#x27; : &#x27;反对&#x27;;
      if (v === &#x27;$totals&#x27;) return state.choice === &#x27;YES&#x27; ? &#x27;4,000,000 / 1,000,000 CKB&#x27; : &#x27;3,900,000 / 1,100,000 CKB&#x27;;
      return v;
    };
    const render = () =&gt; {
      const steps = scenarios[state.scenario];
      const s = steps[state.step];
      el(&#x27;scenario&#x27;).value = state.scenario;
      el(&#x27;position&#x27;).textContent = &#x27;第 &#x27; + (state.step + 1) + &#x27; 步 / &#x27; + steps.length + &#x27; 步&#x27;;
      el(&#x27;place&#x27;).textContent = s.place;
      el(&#x27;title&#x27;).textContent = s.title;
      el(&#x27;detail&#x27;).textContent = s.detail;
      el(&#x27;fields&#x27;).replaceChildren();
      s.fields.forEach(([label, value]) =&gt; {
        const dt = document.createElement(&#x27;dt&#x27;);
        const dd = document.createElement(&#x27;dd&#x27;);
        dt.textContent = label;
        dd.textContent = resolveValue(value);
        el(&#x27;fields&#x27;).append(dt, dd);
      });
      el(&#x27;choice&#x27;).hidden = !s.choose;
      el(&#x27;yes&#x27;).setAttribute(&#x27;aria-pressed&#x27;, String(state.choice === &#x27;YES&#x27;));
      el(&#x27;no&#x27;).setAttribute(&#x27;aria-pressed&#x27;, String(state.choice === &#x27;NO&#x27;));
      el(&#x27;back&#x27;).disabled = state.step === 0;
      el(&#x27;next&#x27;).disabled = state.step === steps.length - 1;
      el(&#x27;next&#x27;).textContent = s.next || &#x27;本场景结束&#x27;;

    globalThis.location.search,

  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
